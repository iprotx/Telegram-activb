name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: telegram_activb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d telegram_activb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/telegram_activb
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Ruff format
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Alembic migrations
        run: alembic upgrade head
      - name: Tests
        run: pytest -q -m "not postgres"
      - name: PostgreSQL integration tests
        run: pytest -q -m postgres
      - name: Alembic check
        run: alembic check
      - name: Dependency audit
        run: python -m pip install pip-audit && pip-audit
      - name: Docker build
        run: docker build --tag telegram-activb:ci .
      - name: Docker runtime smoke
        run: |
          set +e
          output=$(docker run --rm \
            -e BOT_TOKEN=123456:invalid-test-token \
            -e DATABASE_URL=sqlite+aiosqlite:///./smoke.db \
            telegram-activb:ci 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -Eiq 'token|bot|validation|invalid'
          ! printf '%s\n' "$output" | grep -Eiq 'timed out|connection refused|network is unreachable'
